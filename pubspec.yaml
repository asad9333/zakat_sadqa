name: zakat_sadqa
description: Zakat & Sadqa Calculator
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.0
  crypto: ^3.0.3
dev_dependencies:
  flutter_launcher_icons: ^0.13.1
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#0F6B4A"
  adaptive_icon_foreground: "assets/icon_fg.png"
flutter:
  uses-material-design: true
